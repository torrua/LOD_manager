name: CI

# Run after autoformat completes (to get the corrected code)
# Or directly on PRs to check code before merge.
on:
  workflow_run:
    workflows: [Auto-format]
    branches: [main, develop]
    types: [completed]
  pull_request:
    branches: [main, develop]

# Cancel outdated runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Frontend: ESLint + Prettier check + svelte-check (TypeScript)
  # Only runs on pull requests or after autoformat completes
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion != 'failure'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prettier + ESLint + TypeScript
        run: npm run ci:check

  # ─────────────────────────────────────────────────────────────
  # Rust: cargo fmt + cargo clippy + cargo test
  # Runs on windows-latest with MSVC to avoid Linux GTK dependencies
  # ─────────────────────────────────────────────────────────────
  rust:
    name: Rust checks & tests
    runs-on: windows-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion != 'failure'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
